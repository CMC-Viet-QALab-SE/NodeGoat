# OPTIONAL helper — place at: .github/workflows/sca-baseline.yml
# Run manually (Actions tab → "Run workflow") to generate the SCA baseline entirely on
# GitHub Actions — no local tooling, no separate script file. Download the artifact and
# commit it as .trivy-baseline.txt at the repo root. Re-run only when you deliberately
# accept new debt. (The same trivy+jq command below can be run locally if you prefer.)

name: sca-baseline
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  generate:
    name: Generate SCA baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
      - name: Generate baseline (filters MUST match the PR gate)
        run: |
          {
            echo "# SCA baseline — generated by the sca-baseline workflow on $(date -u +%Y-%m-%d)."
            echo "# PR scans ignore these; only NEW fixable Critical/High fail."
            trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --format json . \
              | jq -r '.Results[]?.Vulnerabilities[]?.VulnerabilityID' | sort -u
          } > .trivy-baseline.txt
          echo "Entries: $(grep -vc '^#' .trivy-baseline.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-baseline
          path: .trivy-baseline.txt
          include-hidden-files: true
          retention-days: 7
