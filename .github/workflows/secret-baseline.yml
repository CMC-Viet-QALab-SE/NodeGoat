# OPTIONAL helper — place at: .github/workflows/secret-baseline.yml
# Run manually (Actions tab -> "Run workflow") to generate the detect-secrets baseline
# in the SAME Linux environment the PR secret gate runs in (so file paths use "/" and
# detector versions match). Download the artifact and commit it as .secrets.baseline
# at the repo root. Re-run only when you deliberately accept new legacy findings.
name: secret-baseline
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  generate:
    name: Generate secret baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate .secrets.baseline
        run: |
          pip install detect-secrets==1.5.0
          detect-secrets scan > .secrets.baseline
          echo "Files with findings: $(python -c "import json;print(len(json.load(open('.secrets.baseline'))['results']))")"
      - uses: actions/upload-artifact@v4
        with:
          name: secrets-baseline
          path: .secrets.baseline
          include-hidden-files: true
          retention-days: 7
